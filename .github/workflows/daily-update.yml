name: Actualización diaria y despliegue

on:
  schedule:
    # Dos consultas programadas: 08:05 y 20:05, hora de Lima (UTC-5).
    # 13:05 UTC = 08:05 Lima; 01:05 UTC = 20:05 Lima del día previo.
    # GitHub Actions puede retrasar las ejecuciones programadas.
    - cron: "5 13 * * *"
    - cron: "5 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/daily-update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/willy-stats/package-lock.json

      - name: Construir Willy Stats y verificar cálculos
        run: |
          cd apps/willy-stats
          npm ci
          npm test
          npm run build

      - name: Preparar portada aprobada de Historia de Universitario
        run: base64 --decode site/liga1/img/historia-hero-fondo.jpg.base64 > site/liga1/img/historia-hero-fondo.jpg

      - name: Obtener fotografías auténticas para la historia crema
        run: python scripts/fetch_hist_photos.py

      - name: Obtener fotografías reales para la portada (solo si faltan)
        run: python scripts/fetch_ai_photos.py

      - name: Validar portada y automatización de IA Radar
        run: |
          python scripts/check_home.py
          node --check site/js/core.js
          node --check site/js/hoy.js
          node --check site/js/hero.js

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/argos-translate
          key: argos-${{ runner.os }}-v1

      - name: Instalar traductor al español (versión CPU)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate
          pip install pytrends

      - name: Descargar datos y generar JSON
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/update_data.py

      - name: Verificar datos recientes para Hoy en IA
        run: |
          python - <<'PYCODE'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          base = Path("site/data/current")
          status = json.loads((base / "status.json").read_text())
          news = json.loads((base / "news.json").read_text())
          now = datetime.now(timezone.utc)
          checked = datetime.fromisoformat(status["updated_at"])
          assert timedelta(0) <= now - checked < timedelta(hours=24), "La comprobación de fuentes está desactualizada"
          assert news["updated_at"] == status["updated_at"], "Las noticias no corresponden a esta ejecución"
          feeds = [key for key, value in status["sources"].items() if key.startswith("feed_") and value.get("ok") and value.get("retrieved_at") == status["updated_at"]]
          assert feeds, "Ninguna fuente de noticias respondió; no se puede confirmar la actualización"
          recent = [item for item in news["items"] if timedelta(0) <= now - datetime.fromisoformat(item["published"].replace("Z", "+00:00")) < timedelta(days=7)]
          assert recent, "No hay noticias de los últimos siete días para Hoy en IA"
          print(f"Comprobación: {status['updated_at']}; fuentes de noticias correctas: {len(feeds)}; notas recientes: {len(recent)}")
          PYCODE

      - name: Actualizar datos reales de la Liga 1 y noticias de la U
        continue-on-error: true
        run: |
          pip install beautifulsoup4 lxml
          python scripts/fetch_liga1.py

      - name: Actualizar goleadores de la Liga 1
        continue-on-error: true
        run: python scripts/fetch_liga1_players.py

      - name: Completar escudos verificados de Willy Stats
        continue-on-error: true
        run: python scripts/update_cancha_crests.py

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "ia-radar-bot"
          git config user.email "ia-radar-bot@users.noreply.github.com"
          git add site/data site/history site/liga1/data site/liga1/img site/visual/photos site/futbol/crests
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Actualización diaria de datos ($(date -u +%F))"
            # La compilación modifica archivos publicados que no forman parte del commit de datos.
            # Autostash los conserva durante el rebase y los restaura para el despliegue.
            guardado=no
            for intento in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                guardado=si
                break
              fi
              if [ -n "$(git ls-files -u)" ]; then
                echo "Conflicto de Git: se detiene la publicación para conservar ambos cambios." >&2
                exit 1
              fi
              sleep 5
            done
            test "$guardado" = si
          fi

      - name: Generar páginas de guías, sitemap y robots
        run: python scripts/build_site.py

      - name: Versionar archivos estáticos (evita caché del navegador)
        run: |
          V=$(date +%s)
          find site -name "*.html" -exec sed -i "s/__V__/$V/g" {} +
          echo "$V" > site/version.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Incorporar la última captura deportiva antes de publicar
        run: |
          git fetch origin main
          git restore --source=origin/main -- site/futbol/data/snapshot.json
          if git cat-file -e origin/main:site/futbol/data/health.json 2>/dev/null; then
            git restore --source=origin/main -- site/futbol/data/health.json
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
