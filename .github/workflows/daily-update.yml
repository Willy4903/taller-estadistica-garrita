name: Actualización diaria y despliegue

on:
  schedule:
    # 11:00 UTC = 6:00 am en Lima (UTC-5, sin horario de verano)
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/daily-update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos y generar JSON
        run: python scripts/update_data.py

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "ia-radar-bot"
          git config user.email "ia-radar-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Actualización diaria de datos ($(date -u +%F))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
