name: Actualización diaria y despliegue

on:
  schedule:
    # Meta: datos publicados a las 8:00 am de Lima (UTC-5, sin horario de verano).
    # GitHub retrasa las ejecuciones programadas, por eso hay dos horarios tempranos
    # a minutos "raros": 11:47 UTC = 6:47 am y 12:37 UTC = 7:37 am en Lima.
    - cron: "47 11 * * *"
    - cron: "37 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/daily-update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/argos-translate
          key: argos-${{ runner.os }}-v1

      - name: Instalar traductor al español (versión CPU)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate
          pip install pytrends

      - name: Descargar datos y generar JSON
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/update_data.py

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "ia-radar-bot"
          git config user.email "ia-radar-bot@users.noreply.github.com"
          git add site/data site/history
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Actualización diaria de datos ($(date -u +%F))"
            git pull --rebase origin main && git push
          fi

      - name: Generar páginas de guías, sitemap y robots
        run: python scripts/build_site.py

      - name: Versionar archivos estáticos (evita caché del navegador)
        run: |
          V=$(date +%s)
          find site -name "*.html" -exec sed -i "s/__V__/$V/g" {} +
          echo "$V" > site/version.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
