name: Actualización diaria y despliegue

on:
  schedule:
    # Meta: datos publicados a las 11:00 pm y a las 8:00 am de Lima (UTC-5, sin horario de verano).
    # GitHub retrasa mucho las ejecuciones programadas (a veces horas), por eso hay varios
    # horarios escalonados antes de cada hora meta; si una corre, las demás solo refrescan.
    # Noche: 03:07, 03:47 y 04:27 UTC = 10:07, 10:47 y 11:27 pm en Lima.
    - cron: "7 3 * * *"
    - cron: "47 3 * * *"
    - cron: "27 4 * * *"
    # Mañana: 09:17, 10:07, 10:47, 11:47 y 12:37 UTC = 4:17, 5:07, 5:47, 6:47 y 7:37 am en Lima.
    - cron: "17 9 * * *"
    - cron: "7 10 * * *"
    - cron: "47 10 * * *"
    - cron: "47 11 * * *"
    - cron: "37 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/daily-update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.local/share/argos-translate
          key: argos-${{ runner.os }}-v1

      - name: Instalar traductor al español (versión CPU)
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate
          pip install pytrends

      - name: Descargar datos y generar JSON
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/update_data.py

      - name: Actualizar datos reales de la Liga 1 y noticias de la U
        continue-on-error: true
        run: |
          pip install beautifulsoup4 lxml
          python scripts/fetch_liga1.py

      - name: Actualizar goleadores de la Liga 1
        continue-on-error: true
        run: python scripts/fetch_liga1_players.py

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "ia-radar-bot"
          git config user.email "ia-radar-bot@users.noreply.github.com"
          git add site/data site/history site/liga1/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Actualización diaria de datos ($(date -u +%F))"
            git pull --rebase origin main && git push
          fi

      - name: Generar páginas de guías, sitemap y robots
        run: python scripts/build_site.py

      - name: Versionar archivos estáticos (evita caché del navegador)
        run: |
          V=$(date +%s)
          find site -name "*.html" -exec sed -i "s/__V__/$V/g" {} +
          echo "$V" > site/version.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
