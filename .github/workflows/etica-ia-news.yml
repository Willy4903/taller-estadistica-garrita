name: IA Responsable - noticias (4 veces al día)

on:
  schedule:
    # Hora de Lima (UTC-5): 06:00, 12:00, 16:00 y 20:00.
    # Equivale a 11:00, 17:00, 21:00 y 01:00 UTC. Se usa el minuto 7 para evitar la congestión de :00;
    # GitHub Actions puede retrasar las ejecuciones programadas.
    - cron: "7 11,17,21 * * *"
    - cron: "7 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_etica_news.py
      - .github/workflows/etica-ia-news.yml

permissions:
  contents: write
  pages: write
  actions: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  news-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer fuentes y filtrar noticias de IA
        run: python scripts/fetch_etica_news.py
      - name: Guardar noticias
        run: |
          git config user.name "etica-ia-news-bot"
          git config user.email "etica-ia-news-bot@users.noreply.github.com"
          git add site/etica-ia/data/news.json
          if git diff --cached --quiet; then
            echo "Sin cambios en las noticias."
          else
            git commit -m "IA Responsable: noticias automáticas $(TZ=America/Lima date '+%Y-%m-%d %H:%M')"
            for intento in 1 2 3; do
              if git pull --rebase origin main; then
                git push origin main && break
              else
                # Conflicto con otra actualización de noticias: se conserva la versión recién descargada.
                git checkout --theirs -- site/etica-ia/data/news.json
                git add site/etica-ia/data/news.json
                GIT_EDITOR=true git rebase --continue && git push origin main && break
              fi
              sleep 5
            done
          fi
      - name: Versionar archivos estáticos (evita caché del navegador)
        run: |
          V=$(date +%s)
          find site -name "*.html" -exec sed -i "s/__V__/$V/g" {} +
          echo "$V" > site/version.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # A veces la API de Pages aún no ve el artefacto recién subido: se espera y se reintenta una vez.
      - name: Esperar antes de reintentar el despliegue
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
