name: Willy Stats - datos deportivos actuales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/willy-stats-data.yml
      - scripts/update_cancha.py
  schedule:
    # Cada tres horas; son instantáneas, no un marcador en vivo.
    - cron: '17 */3 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar integridad del proveedor sin red
        run: python -m unittest discover -s scripts -p test_cancha_provider.py -v
      - name: Consultar tablas y partidos de las temporadas vigentes
        continue-on-error: true
        run: python scripts/update_cancha.py
      - name: Guardar capturas verificadas y estado de cada fuente
        run: |
          git config user.name 'willy-stats-data-bot'
          git config user.email 'willy-stats-data-bot@users.noreply.github.com'
          git add site/futbol/data/snapshot.json site/futbol/data/health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar datos deportivos actuales y estado de fuentes'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Exigir datos actuales antes de publicar
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          data=json.loads(Path('site/futbol/data/snapshot.json').read_text())
          now=datetime.now(timezone.utc)
          current={k:v for k,v in data['competitions'].items() if v.get('historical') is False
                   and any(g.get('rows') for g in v.get('groups', []))
                   and datetime.fromisoformat(v['updated_at']) >= now-timedelta(hours=24)}
          if not current:
              raise SystemExit('No se recibieron tablas actuales válidas. Revisar data/health.json; no se publica una página vacía como actualizada.')
          print('Competiciones con datos actuales:', ', '.join(sorted(current)))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
