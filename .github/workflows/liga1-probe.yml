name: Sondeo de fuentes de jugadores Liga 1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 lxml >/dev/null
      - name: Sondear
        run: python scripts/probe_players.py
