name: Validar Willy Stats

on:
  pull_request:
    paths:
      - "apps/willy-stats/**"
      - "scripts/update_willy_stats.py"
      - "scripts/test_willy_stats.py"
      - "site/futbol/README.md"
      - ".github/workflows/willy-stats-data.yml"
      - ".github/workflows/validate-willy-stats.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/willy-stats/package-lock.json
      - name: Probar integridad sin red
        run: |
          python -m unittest discover -s scripts -p test_willy_stats.py -v
          python -m unittest discover -s scripts -p test_cancha_provider.py -v
      - name: Compilar y probar aplicación
        run: |
          cd apps/willy-stats
          npm ci
          npm test
          npm run build
      - name: Probar interfaz publicada en Chromium
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          node scripts/check_cancha.cjs
